services:
  patito-ide:
    build: .
    image: patito-masmas-ide
    container_name: patito-ide
    ports:
      - "8080:8080"
    restart: unless-stopped

    # --- Hardening: untrusted code runs inside this container ---
    # Root filesystem is immutable; only /tmp (where each run gets its
    # own scratch directory) is writable, backed by memory
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 1g
    cpus: 1.0

    environment:
      # Set to 1 only when running behind a reverse proxy that sets
      # X-Forwarded-For, so rate limiting applies to the real client IP
      - PATITO_TRUST_PROXY=0
      # How many programs may run at the same time
      - PATITO_MAX_CONCURRENT=2
      # Per-run limits (seconds of CPU, wall-clock timeout, bytes of RAM)
      - PATITO_CPU_SECONDS=5
      - PATITO_RUN_TIMEOUT=10
      - PATITO_MEMORY_BYTES=1073741824
      # Max wall-clock lifetime of an interactive terminal session; a
      # program can idle on lee() input up to this long before being killed
      - PATITO_SESSION_TIMEOUT=300
